_schema-version: 3.3.0
ID: salesorder_0414
description: A simple CAP project.
version: 1.0.0
modules:
  - name: salesorder_0414-srv
    type: nodejs
    path: gen/srv
    requires:
      - name: salesorder_0414-db
      - name: salesorder_0414-destination
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    parameters:
      buildpack: nodejs_buildpack
      instances: 1
    build-parameters:
      builder: npm-ci
  - name: salesorder_0414-db-deployer
    type: hdb
    path: gen/db
    requires:
      - name: salesorder_0414-db
    parameters:
      buildpack: nodejs_buildpack
  - name: salesorder_0414-app-deployer
    type: com.sap.application.content
    path: gen
    requires:
      - name: srv-api
      - name: salesorder_0414-html5-repo-host
        parameters:
          config:
            HTML5Runtime_enabled: true
          content-target: true
    build-parameters:
      build-result: app/
      requires:
        - artifacts:
            - salesordermsc0414salesorder.zip
          name: salesordermsc0414salesorder
          target-path: app/
  - name: salesordermsc0414salesorder
    type: html5
    path: app/salesorder
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms:
        []
resources:
  - name: salesorder_0414-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: salesorder_0414-destination
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        HTML5Runtime_enabled: false
        init_data:
          instance:
            destinations:
              - Authentication: NoAuthentication
                Name: ui5
                ProxyType: Internet
                Type: HTTP
                URL: https://ui5.sap.com
              - Authentication: NoAuthentication
                HTML5.DynamicDestination: true
                HTML5.ForwardAuthToken: true
                Name: srv-api
                ProxyType: Internet
                Type: HTTP
                URL: ~{srv-api/srv-url}
            existing_destinations_policy: update
      service: destination
      service-plan: lite
    requires:
      - name: srv-api
  - name: salesorder_0414-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
